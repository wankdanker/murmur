name: Build

# Every push to main refreshes the "latest" pre-release with a fresh zip.
# Pushing a tag like v0.2.0 publishes a versioned release.
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm test

      - name: Stamp version from tag
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          node -e '
            const fs = require("fs");
            const v = process.env.GITHUB_REF_NAME.slice(1);
            const m = JSON.parse(fs.readFileSync("src/manifest.json"));
            m.version = v;
            fs.writeFileSync("src/manifest.json", JSON.stringify(m, null, 2) + "\n");
          '

      - run: npm run package

      - uses: actions/upload-artifact@v4
        with:
          name: murmur
          path: dist/

      - name: Update "latest" pre-release
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest murmur.zip --prerelease --target "$GITHUB_SHA" \
            --title "Latest build (main)" \
            --notes "Built from ${GITHUB_SHA::7}. Unzip, then load the folder at chrome://extensions with Developer mode on (Load unpacked)."

      - name: Publish versioned release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp murmur.zip "murmur-${GITHUB_REF_NAME}.zip"
          gh release create "$GITHUB_REF_NAME" "murmur-${GITHUB_REF_NAME}.zip" --generate-notes
