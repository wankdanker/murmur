name: Build

# Every push to main refreshes the "latest" pre-release with a fresh zip.
# A versioned release comes from either pushing a tag like v0.2.0, or
# Actions > Build > Run workflow with a version filled in (no terminal needed).
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version, e.g. 0.2.0 (leave empty to just build)'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm test

      - name: Work out release version
        id: version
        env:
          INPUT_VERSION: ${{ inputs.version }}
          GH_TOKEN: ${{ github.token }}
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            v="${GITHUB_REF_NAME#v}"
          else
            v="${INPUT_VERSION#v}"
          fi
          if [[ -z "$v" ]]; then exit 0; fi
          # Chrome accepts 1-4 dot-separated integers.
          if ! [[ "$v" =~ ^[0-9]+(\.[0-9]+){0,3}$ ]]; then
            echo "::error::Version '$v' must look like 0.2.0"; exit 1
          fi
          if [[ "$GITHUB_EVENT_NAME" == workflow_dispatch ]] && gh release view "v$v" >/dev/null 2>&1; then
            echo "::error::Release v$v already exists"; exit 1
          fi
          echo "version=$v" >> "$GITHUB_OUTPUT"

      - name: Stamp version into manifest
        if: steps.version.outputs.version != ''
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          node -e '
            const fs = require("fs");
            const v = process.env.VERSION;
            const m = JSON.parse(fs.readFileSync("src/manifest.json"));
            m.version = v;
            fs.writeFileSync("src/manifest.json", JSON.stringify(m, null, 2) + "\n");
          '

      - run: npm run package

      - uses: actions/upload-artifact@v4
        with:
          name: murmur
          path: dist/

      - name: Update "latest" pre-release
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest murmur.zip --prerelease --target "$GITHUB_SHA" \
            --title "Latest build (main)" \
            --notes "Built from ${GITHUB_SHA::7}. Unzip, then load the folder at chrome://extensions with Developer mode on (Load unpacked)."

      - name: Publish versioned release
        if: steps.version.outputs.version != ''
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: v${{ steps.version.outputs.version }}
        run: |
          cp murmur.zip "murmur-${TAG}.zip"
          # Creates the tag on this commit when it doesn't exist yet (the
          # Run workflow path). Tags made with GITHUB_TOKEN don't re-trigger
          # this workflow.
          gh release create "$TAG" "murmur-${TAG}.zip" --target "$GITHUB_SHA" --title "Murmur $TAG" --generate-notes
